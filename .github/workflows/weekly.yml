name: weekly-report
on:
  schedule:
    - cron: "0 14 * * 1"        # Mondays 14:00 UTC
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: weekly-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - run: pytest -q
      - run: python -m ivi_tracker run --window 30
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}          # only if anonymous access fails
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      - name: Commit reports and snapshot
        run: |
          git config user.name "ivi-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports data/snapshots data/app
          git commit -m "Weekly report $(date -u +%F)" || echo "No changes"
          git push
